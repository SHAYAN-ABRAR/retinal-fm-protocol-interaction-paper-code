# ===========================================================================
# paths.yaml -- filesystem layout, populated from an ACTUAL inspection of
# D:\DB performed on 2026-08-19. Every path below was verified to exist.
#
# EDIT THIS FILE if you move the datasets. Nothing else hard-codes paths.
# ===========================================================================

project_root: "D:/Research Code/dr_domain_generalization"
data_root:    "D:/DB"
outputs_root: "D:/Research Code/dr_domain_generalization/outputs"

# ---------------------------------------------------------------------------
# Domain definitions.
#
# `domain_id` follows the numbering fixed in the research brief:
#     0 = DDR, 1 = APTOS, 2 = IDRiD, 3 = EyePACS
# The physical folders in D:\DB are named "Dataset 1..4" and do NOT follow
# that order. The mapping below is the authoritative link between the two and
# was established by inspecting file names, CSV contents and label counts --
# not by assuming folder order.
# ---------------------------------------------------------------------------
domains:

  # -- Domain 0 ------------------------------------------------------------
  ddr:
    domain_id: 0
    name: "DDR"
    source_folder: "D:/DB/Dataset 4"
    image_dir: "D:/DB/Dataset 4/DR_grading/DR_grading"
    label_csv: "D:/DB/Dataset 4/DR_grading.csv"
    csv_columns: {image: "id_code", label: "diagnosis"}
    image_ext: ".jpg"
    # id_code already carries the ".jpg" suffix in this CSV.
    id_includes_extension: true
    provided_splits: false          # DDR's official train/valid/test split is
                                    # NOT preserved here; one flat folder.
    patient_ids_recoverable: false  # see docs/DATA_PROVENANCE.md
    verified:
      csv_rows: 12522
      files_on_disk: 12524
      files_not_in_csv: ["007-7449-601.jpg", "007-7447-601.jpg"]   # exclude
      label_counts: {0: 6266, 1: 630, 2: 4477, 3: 236, 4: 913}

  # -- Domain 1 ------------------------------------------------------------
  aptos:
    domain_id: 1
    name: "APTOS 2019"
    source_folder: "D:/DB/Dataset 2"
    splits:
      train: {csv: "D:/DB/Dataset 2/train_1.csv", image_dir: "D:/DB/Dataset 2/train_images/train_images"}
      val:   {csv: "D:/DB/Dataset 2/valid.csv",   image_dir: "D:/DB/Dataset 2/val_images/val_images"}
      test:  {csv: "D:/DB/Dataset 2/test.csv",    image_dir: "D:/DB/Dataset 2/test_images/test_images"}
    csv_columns: {image: "id_code", label: "diagnosis"}
    image_ext: ".png"
    id_includes_extension: false
    provided_splits: true           # 2930 / 366 / 366, verified disjoint
    patient_ids_recoverable: false  # 12-hex anonymous ids, no eye/patient link
    verified:
      total_images: 3662
      split_sizes: {train: 2930, val: 366, test: 366}
      split_id_overlap: 0
      missing_images: 0

  # -- Domain 2 ------------------------------------------------------------
  idrid:
    domain_id: 2
    name: "IDRiD"
    source_folder: "D:/DB/Dataset 3"
    task_subfolder: "B. Disease Grading"     # A. Segmentation / C. Localization unused
    splits:
      train:
        csv: "D:/DB/Dataset 3/B. Disease Grading/2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv"
        image_dir: "D:/DB/Dataset 3/B. Disease Grading/1. Original Images/a. Training Set"
      test:
        csv: "D:/DB/Dataset 3/B. Disease Grading/2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv"
        image_dir: "D:/DB/Dataset 3/B. Disease Grading/1. Original Images/b. Testing Set"
    csv_columns: {image: "Image name", label: "Retinopathy grade"}
    extra_columns: {macular_edema: "Risk of macular edema "}   # trailing space is real
    image_ext: ".jpg"
    id_includes_extension: false
    provided_splits: true
    patient_ids_recoverable: false
    # !! File names COLLIDE across the two splits: both contain IDRiD_001.jpg.
    #    Any unified index MUST namespace ids by split.
    filenames_collide_across_splits: true
    verified:
      split_sizes: {train: 413, test: 103}
      train_label_counts: {0: 134, 1: 20, 2: 136, 3: 74, 4: 49}
      test_label_counts:  {0: 34,  1: 5,  2: 32,  3: 19, 4: 13}

  # -- Domain 3 ------------------------------------------------------------
  eyepacs:
    domain_id: 3
    name: "EyePACS"
    # !!! IMPORTANT !!!
    # There is no standalone EyePACS folder. "Dataset 1" is a third-party
    # DERIVATIVE that pools EyePACS *and* the whole of APTOS, adds baked-in
    # augmented duplicates, and ships leaky train/val/test folders.
    # Read docs/DATA_PROVENANCE.md before using it.
    source_folder: "D:/DB/Dataset 1"
    image_root: "D:/DB/Dataset 1/dr_unified_v2/dr_unified_v2"
    layout: "split/class_folder"           # <root>/{train,val,test}/{0..4}/*.jpg
    label_source: "parent_folder_name"
    image_ext: ".jpg"

    # Reconstruction rules -- applied by src/data/eyepacs.py in Phase 2.
    keep_filename_regex: '^\d+_(left|right)$'   # EyePACS-native ids only
    drop_filename_regex: '(^GF-|-GF$)'          # baked-in augmented copies
    ignore_provided_splits: true                # they leak; we re-split
    ignore_subfolder: "augmented_resized_V2"    # pre-augmented 600x600 pool
    patient_ids_recoverable: true               # patient = digits before _left/_right

    # -- LABEL VERIFICATION (see src/data/eyepacs_labels.py) -----------------
    # Folder-derived labels were checked against an independent copy of the
    # Kaggle trainLabels.csv. Result: 35,108 images agree 100.0000%, and the
    # other 50,070 (the EyePACS *test* portion) have corrupted labels -- they
    # contain ONE grade-3 image where ~1,247 are expected.
    #
    # The domain is therefore restricted to the verified images. The loader
    # reads the index file below and MUST NOT walk the raw folder tree, so the
    # exclusion cannot be bypassed by accident.
    restrict_to_verified_ids: true
    verified_index_csv: "outputs/reports/eyepacs_verified_index.csv"
    reference_labels_csv: "data_external/eyepacs_trainLabels.csv"
    reference_labels_url: "https://huggingface.co/datasets/ctmedtech/EYEPACS/resolve/main/trainLabels.csv"
    reference_labels_sha256: "c1b284d44fed13ba2585bde9cb46bb8a70079568fd5265ce35982532ffbce3e2"
    label_provenance: >-
      Kaggle "Diabetic Retinopathy Detection" (official, 35,126 train rows)
      -> tanlikesmath/diabetic-retinopathy-resized (35,108 rows; 18 unreadable
      images dropped) -> the reference CSV. Corroborated by three independent
      mirrors, by the published class distribution, and by 100% agreement with
      an independently produced derivative.

    verified:
      # -- the usable domain ------------------------------------------------
      images_used: 35108
      patients_used: 17561
      label_agreement_rate: 1.0
      label_counts_used: {0: 25802, 1: 2438, 2: 5288, 3: 872, 4: 708}
      both_eyes_same_grade_pct: 87.3      # why patient-level splitting matters

      # -- what was excluded, and why ---------------------------------------
      images_present_in_folder: 85178
      images_excluded_unverified: 50070
      excluded_label_counts: {0: 39541, 1: 1457, 2: 7865, 3: 1, 4: 1206}
      excluded_reason: "grade 3 has 1 image where ~1247 are expected; labels corrupted"
      aptos_images_pooled_in: 3662        # == 100% of the APTOS domain

      # -- integrity of the shipped folders (measured, all rejected) --------
      label_conflicts_across_folders: 0
      provided_split_base_image_overlap: {train_val: 563, train_test: 575, val_test: 93}
      provided_split_patient_overlap:    {train_val: 6748, train_test: 6679, val_test: 817}

# ---------------------------------------------------------------------------
# Hard exclusion rules -- enforced with assertions, never silently.
# ---------------------------------------------------------------------------
exclusions:
  # APTOS images must come ONLY from Domain 1 (Dataset 2). Every APTOS-style
  # id inside Dataset 1 is a duplicate of a Domain-1 image and would otherwise
  # place the same photograph in two "different" domains.
  eyepacs_must_not_contain_aptos: true
  aptos_filename_regex: '^[0-9a-f]{12}$'

  # EyePACS images whose grade could not be confirmed against the reference
  # labels are excluded. Their labels are demonstrably corrupted, not merely
  # unverified.
  eyepacs_verified_ids_only: true

  # Never read from these paths.
  forbidden_paths:
    - "D:/DB/Dataset 1/augmented_resized_V2"
