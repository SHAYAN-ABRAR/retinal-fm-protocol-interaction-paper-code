[pytest]
testpaths = tests
# `slow` marks tests that read the real outputs/ tree rather than fixtures --
# currently the end-to-end consistency audit. They are part of the default run;
# the marker exists so they can be deselected with `-m "not slow"` when the
# artifacts are absent, and so pytest does not warn about an unknown mark.
markers =
    slow: reads the checked-in experiment artifacts rather than fixtures
