# ===========================================================================
# domain_generalization.yaml -- the method variants under comparison.
#
# Each extends baseline.yaml and states ONLY what it changes. That is the point:
# if a variant differed from the baseline in anything other than the named
# mechanism, the ablation would be measuring the wrong thing.
#
# THE TWO CORALs ARE DIFFERENT METHODS. They share an acronym and nothing else:
#
#   ordinal      -> src/losses/ordinal_coral_loss.py
#                   CORAL *ordinal regression* (Cao et al. 2020). Exploits the
#                   grade ordering 0 < 1 < 2 < 3 < 4 via K-1 rank-consistent
#                   binary tasks. Has nothing to do with domains.
#
#   deep_coral   -> src/losses/deep_coral_alignment.py
#                   Deep CORAL = CORrelation ALignment (Sun & Saenko 2016).
#                   Matches second-order feature statistics across SOURCE
#                   domains. Has nothing to do with label ordering.
#
# They are separate ablation axes, so deep_coral_ordinal combines them without
# redundancy.
#
# Calibration is deliberately NOT a variant here: temperature scaling is
# post-hoc and applies to any trained model, so treating it as a training
# variant would double the run count for nothing.
# ===========================================================================

# Load one of these with:
#   from src.utils.config import resolve_config
#   config = resolve_config("domain_generalization.yaml", overrides={"method": {"name": "mixstyle"}})
#
# or reference a named variant from experiments.yaml.

extends: baseline.yaml

name: domain_generalization
description: >-
  Method variants sharing the baseline training recipe. Override method.name to
  select one of: erm, ordinal, deep_coral, mixstyle, mixstyle_ordinal,
  deep_coral_ordinal.

method:
  name: deep_coral

  # --- Deep CORAL -------------------------------------------------------
  # lambda weights the covariance-alignment term against the task loss.
  # 1.0 is the paper's default and is what the recorded runs used; it has NOT
  # been tuned here. Any tuning must use SOURCE validation only -- searching it
  # against the held-out target would make the external evaluation internal.
  coral_lambda: 1.0

  # --- MixStyle ---------------------------------------------------------
  # p: probability of mixing a given batch. alpha: Beta parameter; 0.1 puts most
  # mass near 0 and 1 so a mixed sample resembles one of the two styles rather
  # than an implausible average.
  # stages: how many EARLY backbone stages get a MixStyle module. Style lives in
  # low-level features; mixing deep layers corrupts the lesion evidence the
  # label depends on.
  mixstyle_p: 0.5
  mixstyle_alpha: 0.1
  mixstyle_stages: 2

  # --- ordinal CORAL ----------------------------------------------------
  # Per-threshold importance weights for imbalanced ordinal data. Off by default
  # because the recorded runs did not use them; the collapse of grades 1 and 3
  # observed in those runs makes this the obvious next thing to try.
  ordinal_importance_weights: false

# ---------------------------------------------------------------------------
# Known result for these settings (Stage C, seed 42, n=507 unseen IDRiD).
# Recorded here so the file cannot drift from what it produced:
#
#   method                target QWK   target ECE   grade-3 recall
#   erm                       0.753        0.265            0.242
#   ordinal                   0.665        0.059            0.011
#   deep_coral                0.665        0.335            0.066
#   mixstyle                  0.643        0.302            0.066
#   mixstyle_ordinal          0.662        0.063            0.011
#   deep_coral_ordinal        0.671        0.071            0.011
#
# No variant beat ERM on target QWK. The ordinal ECE gain comes with collapse of
# grades 1 and 3 -- see docs/PHASE4_METHOD_COMPARISON.md before reading the ECE
# column as an improvement.
# ---------------------------------------------------------------------------
